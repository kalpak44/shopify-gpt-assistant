# This file stores configurations for your Shopify app.
# It must exist at the root of your app.

name = "Assistant GPT"
client_id = "aa2e8ef1ecccc3b3abdae1a3b8a77ae6"
application_url = "https://shopify-gpt-assistant.pavel-usanli.online"
embedded = true

[auth]
redirect_urls = [
    "https://shopify-gpt-assistant.pavel-usanli.online/auth/callback",
    "https://shopify-gpt-assistant.pavel-usanli.online/auth/shopify/callback",
    "https://shopify-gpt-assistant.pavel-usanli.online/api/auth/callback",
    "https://shopify-gpt-assistant.pavel-usanli.online/assistant/billing/confirm"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/webhooks"

[access_scopes]
scopes = "read_themes,write_themes,read_orders,write_orders,read_draft_orders,write_draft_orders,read_products,write_products,read_inventory,write_inventory,read_customers,write_customers,read_discounts,write_discounts,read_price_rules,write_price_rules,read_marketing_events,write_marketing_events,read_metaobjects,write_metaobjects,read_markets,write_markets,read_analytics,read_reports,write_reports,read_fulfillments,write_fulfillments,read_shipping,write_shipping,read_gift_cards,write_gift_cards,read_locations,read_publications,write_publications,read_online_store_navigation,write_online_store_navigation"
[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false